name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon runner; Intel Macs can run from source (see README).
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packaging/requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r packaging/requirements.txt -r packaging/requirements-build.txt

      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build app
        run: python -X utf8 -m PyInstaller --clean --noconfirm --distpath build/dist --workpath build/work packaging/macos/AeroxLite.spec

      - name: Self-test the built app
        run: '"build/dist/Aerox Lite.app/Contents/MacOS/Aerox Lite" --self-test'

      - name: Package (drag-to-Applications disk image)
        run: packaging/macos/make-dmg.sh AeroxLite-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroxLite-macos-arm64
          path: AeroxLite-macos-arm64.dmg

      - name: Release notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/release_notes.py "${{ github.ref_name }}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AeroxLite-macos-arm64.dmg
          body_path: release-notes.md
